<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>MentorSphere Signup</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="auth-container">

<div class="left-panel">

<div class="brand">
<h1>MentorSphere</h1>
<p>AI-Driven Academic Mentorship Platform</p>
</div>

<div class="left-content">

<h2>
Create Your Account<br>
<span>Join. Learn. Grow.</span>
</h2>

<p>
Become part of MentorSphere and connect
with mentors, resources and opportunities.
</p>

<img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png">

</div>

</div>

<div class="right-panel">

<div class="form-card signup-card">

<h2>Create Account</h2>

<p>Fill your details to continue</p>

<form action="dashboard.html">

<input type="text" placeholder="Full Name">

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<select>
<option>Select Role</option>
<option>Junior</option>
<option>Senior</option>
<option>Alumni</option>
</select>

<button type="submit">
Create Account
</button>

</form>

<div class="bottom-link">
Already have an account?
<a href="login.html">Login</a>
</div>

</div>

</div>

</div>

</body>
</html>
