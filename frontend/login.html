<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MentorSphere Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-container">

        <!-- LEFT PANEL -->
        <div class="left-panel">

            <div class="brand">
                <h1>MentorSphere</h1>
                <p>AI-Driven Academic Mentorship Platform</p>
            </div>

            <div class="left-content">

                <h2>
                    Learn.<br>
                    Connect.<br>
                    <span>Grow Together.</span>
                </h2>

                <p>
                    MentorSphere connects juniors with seniors
                    and alumni for guidance and opportunities.
                </p>

                <img src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png">

            </div>

        </div>


        <!-- RIGHT PANEL -->
        <div class="right-panel">

            <div class="form-card">

                <h2>Welcome Back!</h2>

                <p>Login to continue your mentorship journey</p>


                <!-- LOGIN FORM -->
                <form id="loginForm">

                    <input
                        type="email"
                        id="email"
                        placeholder="Email"
                        required
                    >

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required
                    >

                    <button type="submit">
                        Login
                    </button>

                </form>


                <div class="bottom-link">
                    Don't have an account?
                    <a href="signup.html">Sign Up</a>
                </div>

            </div>

        </div>

    </div>


    
 <script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
        e.preventDefault();

        window.location.href = "dashboard.html";
    });
</script>
  

</body>
</html>
